# Export configuration for ObServe 10.0 LL and ROS LL 4.2.0.
schema_version: "1.0.0"
source:
  root: ll_common.trip
sheets:
  META:
    preserve_fields: [form_identifier, form_revision]
    fields_from: meta
  O-INFO:
    rows:
      rule: one_row
      inputs:
        records: {sheet: ll_common.trip, within: ll_common.trip}
    fields:
      observed_trip_id:
        rule: identity_to_cache
        inputs:
          value: {field: topiaId}
        note: O-INFO.1
      observer_identification_iotc_id: {status: omitted, note: O-INFO.2}
      observer_identification_full_name:
        rule: person_full_name
        inputs:
          value: {field: observer}
        note: O-INFO.3
      observer_trip_details_embarkation_in_port_country: {status: unavailable, note: O-INFO.4}
      observer_trip_details_embarkation_in_port_port: {status: unavailable, note: O-INFO.4}
      observer_trip_details_embarkation_at_sea_latitude: {status: unavailable, note: O-INFO.4}
      observer_trip_details_embarkation_at_sea_longitude: {status: unavailable, note: O-INFO.4}
      observer_trip_details_embarkation_date_time: {status: unavailable, note: O-INFO.4}
      observer_trip_details_disembarkation_in_port_country: {status: unavailable, note: O-INFO.4}
      observer_trip_details_disembarkation_in_port_port: {status: unavailable, note: O-INFO.4}
      observer_trip_details_disembarkation_at_sea_latitude: {status: unavailable, note: O-INFO.4}
      observer_trip_details_disembarkation_at_sea_longitude: {status: unavailable, note: O-INFO.4}
      observer_trip_details_disembarkation_date_time: {status: unavailable, note: O-INFO.4}
      observed_trip_summary_number_fishing_sets_conducted:
        inputs:
          activities: {sheet: ll_observation.activity, fields: [topiaId, vesselActivity], within: ll_common.trip}
          sets: {sheet: ll_observation.fishingSet, fields: [topiaId, activity], within: ll_common.trip}
        note: O-INFO.5
      observed_trip_summary_number_fishing_sets_observed: {note: O-INFO.6}
      observed_trip_summary_number_of_days_searching: {status: pending, note: O-INFO.7}
      observed_trip_summary_number_of_days_actively_fishing: {status: pending, note: O-INFO.7}
      observed_trip_summary_number_of_days_in_fishing_area: {status: pending, note: O-INFO.7}
      observed_trip_summary_number_of_days_transiting: {status: pending, note: O-INFO.7}
      observed_trip_summary_number_of_days_lost: {status: pending, note: O-INFO.7}
      observed_trip_summary_reasons_for_days_lost_reason_1: {status: unavailable, note: O-INFO.8}
      observed_trip_summary_reasons_for_days_lost_reason_2: {status: unavailable, note: O-INFO.8}
      observed_trip_summary_reasons_for_days_lost_reason_3: {status: unavailable, note: O-INFO.8}
      observed_trip_summary_reasons_for_days_lost_reason_4: {status: unavailable, note: O-INFO.8}
  V-INFO:
    rows:
      rule: one_row
      inputs:
        records: {sheet: ll_common.trip, within: ll_common.trip}
    fields:
      observed_trip_id:
        rule: identity_from_cache
      identification_name:
        rule: vessel_identity
        inputs:
          value: {field: vessel}
        parameters: {property: label1}
        note: V-INFO.1
      identification_flag_or_chartering_state:
        inputs:
          value: {field: vessel}
        note: V-INFO.2
      identification_iotc_number:
        rule: vessel_identity
        inputs:
          value: {field: vessel}
        parameters: {property: iotcid}
        note: V-INFO.1
      identification_imo_number:
        rule: vessel_identity
        inputs:
          value: {field: vessel}
        parameters: {property: imoid}
        note: V-INFO.1
      identification_ircs:
        rule: vessel_identity
        inputs:
          value: {field: vessel}
        parameters: {property: radiocallsignid}
        note: V-INFO.1
      registration_country: {status: omitted, note: V-INFO.3}
      registration_port: {status: omitted, note: V-INFO.3}
      registration_registration_number: {status: omitted, note: V-INFO.3}
      licensed_target_species: {status: omitted, note: V-INFO.4}
      gear_main_fishing_gear:
        rule: input
        inputs:
          value: {input: main_fishing_gear}
        note: V-INFO.5
      personnel_fishing_master_full_name:
        rule: person_full_name
        inputs:
          value: {field: captain}
        note: V-INFO.6
      personnel_fishing_master_nationality:
        inputs:
          value: {field: captain}
        note: V-INFO.7
      personnel_skipper_captain_full_name: {status: omitted, note: V-INFO.6}
      personnel_skipper_captain_nationality: {status: omitted, note: V-INFO.7}
      personnel_crew_number:
        rule: copy
        inputs:
          value: {field: noOfCrewMembers}
  V-TRIP:
    rows:
      rule: one_row
      inputs:
        records: {sheet: ll_common.trip, within: ll_common.trip}
    fields:
      observed_trip_id:
        rule: identity_from_cache
      vessel_departure_port_country:
        status: pending
        rule: harbour_country
        inputs:
          value: {field: departureHarbour}
        parameters: {target: refs_admin.countries}
        note: "Resolve the reporting-country meaning; no global FRA to REU substitution."
      vessel_departure_port_port:
        status: pending
        rule: harbour_port
        inputs:
          value: {field: departureHarbour}
        parameters: {target: refs_admin.ports}
        note: "ROS ports have no locode column. Confirm canonical codes where REULPT and FRARELPT coexist."
      vessel_departure_port_latitude:
        status: pending
        rule: harbour_coordinate
        inputs:
          value: {field: departureHarbour}
        parameters: {property: latitude}
        note: "Confirm harbour coordinates represent this endpoint; they do not provide an at-sea position."
      vessel_departure_port_longitude:
        status: pending
        rule: harbour_coordinate
        inputs:
          value: {field: departureHarbour}
        parameters: {property: longitude}
        note: "Confirm harbour coordinates represent this endpoint; they do not provide an at-sea position."
      vessel_departure_date_time:
        status: pending
        rule: date_at_time
        inputs:
          value: {field: startDate}
        parameters: {time: "00:00", timezone: null}
        note: "Reporting time is agreed, timezone is unresolved; this is not an observed movement time."
      vessel_return_port_country:
        status: pending
        rule: harbour_country
        inputs:
          value: {field: landingHarbour}
        parameters: {target: refs_admin.countries}
        note: "Resolve the reporting-country meaning; no global FRA to REU substitution."
      vessel_return_port_port:
        status: pending
        rule: harbour_port
        inputs:
          value: {field: landingHarbour}
        parameters: {target: refs_admin.ports}
        note: "ROS ports have no locode column. Confirm canonical codes where REULPT and FRARELPT coexist."
      vessel_return_port_latitude:
        status: pending
        rule: harbour_coordinate
        inputs:
          value: {field: landingHarbour}
        parameters: {property: latitude}
        note: "Confirm harbour coordinates represent this endpoint; they do not provide an at-sea position."
      vessel_return_port_longitude:
        status: pending
        rule: harbour_coordinate
        inputs:
          value: {field: landingHarbour}
        parameters: {property: longitude}
        note: "Confirm harbour coordinates represent this endpoint; they do not provide an at-sea position."
      vessel_return_date_time:
        status: pending
        rule: date_at_time
        inputs:
          value: {field: endDate}
        parameters: {time: "23:59", timezone: null}
        note: "Reporting time is agreed, timezone is unresolved; this is not an observed movement time."
  V-ATTRIBUTES:
    rows:
      status: pending
      rule: pending_rows
      inputs:
        records: {sheet: ll_common.trip, within: ll_common.trip}
      note: "Optional attributes are omitted; decide no rows versus a trip-ID-only row."
    fields:
      observed_trip_id:
        rule: identity_from_cache
      vessel_attributes_gross_tonnage:
        status: omitted
        rule: omit
        inputs: {}
        note: "Agreed scope: optional vessel attributes remain empty; RAV consolidation is separate."
      vessel_attributes_loa_m:
        status: omitted
        rule: omit
        inputs: {}
        note: "Agreed scope: optional vessel attributes remain empty; RAV consolidation is separate."
      vessel_attributes_hull_material:
        status: omitted
        rule: omit
        inputs: {}
        note: "Agreed scope: optional vessel attributes remain empty; RAV consolidation is separate."
      vessel_attributes_main_engine_1_make:
        status: omitted
        rule: omit
        inputs: {}
        note: "Agreed scope: optional vessel attributes remain empty; RAV consolidation is separate."
      vessel_attributes_main_engine_1_power_value:
        status: omitted
        rule: omit
