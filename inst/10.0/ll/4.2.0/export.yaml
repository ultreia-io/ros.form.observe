  E-SET:
    rows:
      rule: each_set
      inputs:
        records: {sheet: ll_observation.fishingSet, within: ll_common.trip}
    fields:
      observed_trip_id:
        rule: identity_from_cache
      set_id:
        rule: identity
        inputs:
          value: {field: topiaId}
        parameters: {key: set}
      start_setting_date_time:
        status: pending
        rule: timestamp
        inputs:
          value: {field: settingStartTimeStamp}
        parameters: {timezone: null}
        note: "Confirm the stored timezone and serialization convention."
      start_setting_position_latitude:
        rule: copy
        inputs:
          value: {field: settingStartLatitude}
      start_setting_position_longitude:
        rule: copy
        inputs:
          value: {field: settingStartLongitude}
      end_setting_date_time:
        status: pending
        rule: timestamp
        inputs:
          value: {field: settingEndTimeStamp}
        parameters: {timezone: null}
        note: "Confirm the stored timezone and serialization convention."
      end_setting_position_latitude:
        rule: copy
        inputs:
          value: {field: settingEndLatitude}
      end_setting_position_longitude:
        rule: copy
        inputs:
          value: {field: settingEndLongitude}
      vessel_speed_kn:
        rule: copy
        inputs:
          value: {field: settingVesselSpeed}
      line_setter_speed_ms:
        status: pending
        rule: shooter_speed
        inputs:
          speed: {field: shooterSpeed}
          used: {field: shooterUsed}
        note: "Confirm stored knots and reporting when the shooter is unused; no artificial zero."
      mainline_material:
        status: pending
        rule: catalogue_mapping
        inputs:
          value: {field: lineType}
        parameters: {target: refs_fishery.line_material_types}
        note: "Review the initial material correspondences; Polyvinyl has no agreed equivalent."
      mainline_length_value: {status: unavailable}
      mainline_length_unit: {status: unavailable}
      clip_on_time_branchline:
        status: pending
        rule: copy
        inputs:
          value: {field: timeBetweenHooks}
        note: "Source is labelled seconds; confirm equivalence to branchline clip-on time."
      clip_on_time_buoys: {status: unavailable}
      number_total_hooks_set:
        rule: copy
        inputs:
          value: {field: totalHooksCount}
      number_total_floats_set:
        status: pending
        rule: unresolved
        inputs:
          baskets: {field: totalBasketsCount}
        note: "No agreed line-layout rule; do not automatically subtract one from baskets."
      number_radio_dhan_buoys_set: {status: unavailable}
      floatline_length_1_m:
        status: pending
        rule: floatline_length
        inputs:
          compositions: {sheet: ll_observation.floatlinesComposition, fields: [topiaId, length, proportion], within: ll_observation.fishingSet}
        parameters: {slot: 1}
        note: "Highest-proportion selection needs CTOI approval; define duplicate-length aggregation, ties and excess-value diagnostics."
      floatline_length_2_m:
        status: pending
        rule: floatline_length
        inputs:
          compositions: {sheet: ll_observation.floatlinesComposition, fields: [topiaId, length, proportion], within: ll_observation.fishingSet}
        parameters: {slot: 2}
        note: "Highest-proportion selection needs CTOI approval; define duplicate-length aggregation, ties and excess-value diagnostics."
      floatline_length_3_m:
        status: pending
        rule: floatline_length
        inputs:
          compositions: {sheet: ll_observation.floatlinesComposition, fields: [topiaId, length, proportion], within: ll_observation.fishingSet}
        parameters: {slot: 3}
        note: "Highest-proportion selection needs CTOI approval; define duplicate-length aggregation, ties and excess-value diagnostics."
      number_hooks_between_floats:
        status: pending
        rule: copy
        inputs:
          value: {field: branchlinesPerBasketCount}
