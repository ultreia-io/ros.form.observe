  G-GENERAL:
    rows:
      rule: one_row
      inputs:
        records: {sheet: ll_common.trip, within: ll_common.trip}
    fields:
      observed_trip_id:
        rule: identity_from_cache
      special_equipment_or_machinery_line_setter_shooter:
        status: pending
        rule: trip_equipment
        inputs:
          sets: {sheet: ll_observation.fishingSet, field: shooterUsed, within: ll_common.trip}
          equipment: {sheet: ll_common.gearUseFeatures, fields: [gear, usedInTrip], within: ll_common.trip}
        parameters: {equipment: line_setter}
        note: "Distinguish equipment availability from use; a false default is not proof of absence."
      special_equipment_or_machinery_line_hauler:
        status: pending
        rule: trip_equipment
        inputs:
          equipment: {sheet: ll_common.gearUseFeatures, fields: [gear, usedInTrip], within: ll_common.trip}
        parameters: {equipment: line_hauler}
        note: "Candidate gear records are not an established source for this equipment; do not default to FALSE, NAV or UNK."
      special_equipment_or_machinery_bait_casting_machine:
        status: pending
        rule: trip_equipment
        inputs:
          equipment: {sheet: ll_common.gearUseFeatures, fields: [gear, usedInTrip], within: ll_common.trip}
        parameters: {equipment: bait_casting_machine}
        note: "Candidate gear records are not an established source for this equipment; do not default to FALSE, NAV or UNK."
  G-CONFIG-BRANCHLINES:
    rows:
      rule: configurations
      inputs:
        records: {sheet: ll_observation.branchlinesComposition, within: ll_common.trip}
    fields:
      observed_trip_id:
        rule: identity_from_cache
      branchline_configurations_configuration_id:
        rule: identity
        inputs:
          value: {field: topiaId}
        parameters: {key: configuration}
      branchline_configurations_section_id:
        status: omitted
