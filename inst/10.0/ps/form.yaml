# ObServe 10.0 PS extraction model.
# Sheet names are the qualified source table names: schema.table.
# Source: observe-app/core/persistence/migration/src/main/resources/
#         db/migration/v10/10.0/empty-schema-PG.sql
# Ownership: observe-app/model/persistence/src/main/resources/
#            META-INF/navigation/Observe-parent-model.json
# One CSV per sheet, with field names on row 1 and data starting on row 2.
# Column order follows field declaration order. IDs retain their ObServe values.
# Scope: every trip-owned PS data table, including association tables.
# Observation, logbook, landing and local-market records remain separate.
# Catalogue data remain external; references.yaml declares their lookups.
# Reference fields retain ObServe IDs and use the catalogue lookup topiaid.
# mandatory follows source NOT NULL, not ROS requirements or a minimum row count.
# Persistence audit/version columns, homeId and internal list indexes are excluded.
# Source time-only values remain strings; no date or timezone is inferred.
# Do not replace nulls or interpret default false flags as observed absence.
# parent_key describes ownership; other data links remain fields.
# Do not merge observation and logbook records or join independent collections.
schema_version: "1.0.0"
form: {id: ps, version: "10.0"}
references:
  code_lists:
    - common.country
    - common.dataquality
    - common.enginemake
    - common.fpazone
    - common.gear
    - common.gearcharacteristic
    - common.gearcharacteristiclistitem
    - common.gearcharacteristictype
    - common.harbour
    - common.hullmaterial
    - common.ocean
    - common.organism
    - common.sex
    - common.sizemeasuremethod
    - common.sizemeasuretype
    - common.species
    - common.speciesgroup
    - common.speciesgroupreleasemode
    - common.vesseltype
    - common.weightmeasuremethod
    - common.weightmeasuretype
    - common.wind
    - ps_common.acquisitionstatus
    - ps_common.objectmaterial
    - ps_common.objectmaterialtype
    - ps_common.objectoperation
    - ps_common.observedsystem
    - ps_common.program
    - ps_common.reasonfornofishing
    - ps_common.reasonfornullset
    - ps_common.sampletype
    - ps_common.schooltype
    - ps_common.speciesfate
    - ps_common.transmittingbuoyoperation
    - ps_common.transmittingbuoyownership
    - ps_common.transmittingbuoytype
    - ps_common.vesselactivity
    - ps_common.weightcategory
    - ps_common.wellcontentstatus
    - ps_landing.destination
    - ps_landing.fate
    - ps_localmarket.batchcomposition
