    - ps_observation.catchreleaseconformity
    - ps_observation.catchreleasehandlingplace
    - ps_observation.catchreleasestatus
    - ps_observation.catchreleasingtime
    - ps_observation.detectionmode
    - ps_observation.informationsource
    - ps_observation.reasonfordiscard
    - ps_observation.speciesstatus
    - ps_observation.surroundingactivity
